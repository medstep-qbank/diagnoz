<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#04121a">
<title>ДИАГНОЗ — игра-лестница</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#04121a;--g:#2ee6c8;--g2:#17b39c;--c:#5ec8ff;--r:#ff4d6d;--y:#ffd166;--b:#3a86ff;--txt:#e2f6f8;--mut:#7fa3ad;--gold:#ffcc33;--panel:rgba(6,26,36,.85);--line:rgba(46,230,200,.22)}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#matrix{position:fixed;inset:0;z-index:0;opacity:.32;pointer-events:none}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(46,230,200,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(46,230,200,.045) 1px,transparent 1px),linear-gradient(rgba(46,230,200,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(46,230,200,.08) 1px,transparent 1px);background-size:20px 20px,20px 20px,100px 100px,100px 100px}
#app{position:relative;z-index:2;height:100%;overflow:auto}
.hd{font-family:'Russo One','JetBrains Mono',sans-serif;letter-spacing:.04em}
a{color:var(--c)}
.wrap{max-width:860px;margin:0 auto;padding:24px 18px 60px}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;text-align:center}
.logo{font-family:'Russo One',sans-serif;font-size:clamp(34px,11vw,110px);color:var(--g);text-shadow:0 0 18px rgba(46,230,200,.7),0 0 2px #fff;position:relative;line-height:1;letter-spacing:.06em}
.logo{animation:hb 1.4s infinite}
.logo::before{content:'✚';color:var(--r);margin-right:.18em;text-shadow:0 0 18px rgba(255,77,109,.7)}
@keyframes hb{0%,45%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(.99)}34%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
.sub{color:var(--mut);margin-top:10px;font-size:14px;letter-spacing:.2em;text-transform:uppercase}
.typed{color:var(--g);font-size:13px;margin-top:18px;min-height:1.4em;opacity:.85}
.typed::after{content:'█';animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.btn{font-family:'Russo One','JetBrains Mono',sans-serif;letter-spacing:.06em;font-size:17px;border:1.5px solid var(--g);background:rgba(46,230,200,.08);color:var(--g);padding:14px 22px;border-radius:6px;cursor:pointer;text-transform:uppercase;transition:.15s;box-shadow:0 0 0 rgba(46,230,200,0)}
.btn:hover{background:rgba(46,230,200,.18);box-shadow:0 0 18px rgba(46,230,200,.35)}
.btn:active{transform:scale(.97)}
.btn.big{font-size:20px;padding:18px 28px}
.btn.full{width:100%}
.btn.c{border-color:var(--c);color:var(--c);background:rgba(0,229,255,.08)}
.btn.r{border-color:var(--r);color:var(--r);background:rgba(255,46,85,.08)}
.btn.s{font-size:13px;padding:8px 12px}
.btn:disabled{opacity:.35;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px;backdrop-filter:blur(2px)}
.panel h3{font-family:'Russo One',sans-serif;color:var(--g);font-size:15px;letter-spacing:.12em;margin-bottom:12px;text-transform:uppercase}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
input,select,textarea{font-family:inherit;font-size:16px;background:#020b10;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 2px rgba(46,230,200,.15)}
textarea{width:100%;min-height:340px;font-size:13px;line-height:1.5;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--g)}
.muted{color:var(--mut);font-size:13px}
.err{color:var(--r);font-size:13px}
.ok{color:var(--g)}
.warnbox{border:1px solid var(--y);color:var(--y);background:rgba(255,212,0,.06);padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.5;margin-top:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.topbar .hd{color:var(--g);font-size:22px}
pre.code{white-space:pre-wrap;background:#020b10;border:1px dashed var(--line);border-radius:6px;padding:12px;font-size:12.5px;color:var(--txt);line-height:1.5}

/* ===== lobby */
.lobby{min-height:100%;display:flex;flex-direction:column;padding:20px}
.lobtop{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.codebox{text-align:center}
.codebox .lbl{color:var(--mut);font-size:13px;letter-spacing:.2em}
.codebox .code{font-family:'Russo One',sans-serif;font-size:clamp(54px,9vw,104px);color:var(--g);letter-spacing:.12em;text-shadow:0 0 22px rgba(46,230,200,.6)}
.codebox .url{font-size:13px;color:var(--c);word-break:break-all;max-width:420px;margin:6px auto 0}
#qr{background:#fff;padding:10px;border-radius:8px;width:max-content;min-width:60px;min-height:60px}
#qr img,#qr canvas{display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px auto;max-width:1100px}
.chip{border:1px solid var(--pc,var(--g));color:var(--pc,var(--g));padding:8px 12px;border-radius:30px;font-weight:700;display:flex;align-items:center;gap:8px;animation:chipIn .4s ease;background:rgba(0,0,0,.4)}
.chip button{background:none;border:none;color:var(--mut);font-size:16px;cursor:pointer;line-height:1}
@keyframes chipIn{from{transform:scale(.3);opacity:0}}
.cnt{font-family:'Russo One',sans-serif;color:var(--c);font-size:22px;text-align:center;margin-top:16px}

/* ===== host game */
.hg{height:100%;display:flex;flex-direction:column}
.hbar{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(0,10,6,.85);flex-wrap:wrap}
.hbar .logo-s{font-family:'Russo One',sans-serif;color:var(--g);font-size:24px;text-shadow:0 0 10px rgba(46,230,200,.6)}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-family:'Russo One',sans-serif;font-size:22px;color:var(--c)}
.stat span{font-size:10px;color:var(--mut);letter-spacing:.15em;text-transform:uppercase}
.hbar .sp{flex:1}
.hmain{flex:1;display:flex;min-height:0}
.arena{flex:1;display:flex;padding:12px 10px 10px 6px;gap:6px;min-width:0}
.lvlcol,.lad{display:flex;flex-direction:column}
.lvlcol{width:96px;flex:none}
.lvlcol .rk,.lad .rk{height:26px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Russo One',sans-serif;font-size:14px;color:var(--mut)}
.lvlcol .nm,.lad .nm{height:42px;flex:none}
.cells{flex:1;display:flex;flex-direction:column;gap:3px;min-height:0}
.lvlcol .cell{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:10.5px;color:var(--mut);letter-spacing:.05em;white-space:nowrap;border-right:1px solid var(--line)}
.lvlcol .cell.top{color:var(--gold);font-weight:800}
.ladders{flex:1;display:flex;gap:5px;min-width:0}
.lad{flex:1;min-width:34px;max-width:110px;position:relative}
.lad .cell{flex:1;border-radius:3px;background:rgba(46,230,200,.035);border:1px solid rgba(46,230,200,.10);transition:background .35s,box-shadow .35s;position:relative;display:flex;align-items:center;justify-content:center;font-size:13px;color:#03201c;font-weight:800}
.lad .cell.on{background:linear-gradient(180deg,var(--pc),color-mix(in srgb,var(--pc) 45%,#000));border-color:var(--pc);box-shadow:0 0 6px color-mix(in srgb,var(--pc) 60%,transparent)}
.lad .cell.cur{box-shadow:0 0 14px var(--pc),0 0 2px #fff inset}
.lad .cells{position:relative}
.doc{position:absolute;left:0;width:100%;height:calc(100% / var(--n));bottom:calc((var(--s) - 1) * 100% / var(--n));transition:bottom .55s cubic-bezier(.3,1.4,.5,1),left .55s cubic-bezier(.3,1.4,.5,1);pointer-events:none;z-index:2;display:flex;justify-content:center}
.doc svg{height:100%;max-width:100%;overflow:visible;filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.doc .dc{fill:#f4f8fa}.doc .dl{fill:color-mix(in srgb,var(--pc) 55%,#000)}.doc .dh{fill:#f1c7a5}
.lad.up .doc svg{animation:hop .55s}
.lad.down .doc svg{animation:fall .6s}
.lad.win .doc svg{animation:cheer 1s infinite;filter:drop-shadow(0 0 8px var(--gold))}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-35%) scale(1.1)}}
@keyframes fall{0%,100%{transform:none}30%{transform:rotate(-25deg)}60%{transform:rotate(15deg)}}
@keyframes cheer{0%,100%{transform:none}50%{transform:translateY(-15%)}}
@media (prefers-reduced-motion:reduce){.doc{transition:none}.doc svg{animation:none!important}}
.lad .cell.lost{background:var(--r)!important;box-shadow:0 0 18px var(--r)!important;animation:lost .9s forwards}
@keyframes lost{0%{opacity:1}100%{opacity:.05}}
.lad .nm{display:flex;align-items:flex-start;justify-content:center;padding-top:5px;font-size:12px;font-weight:700;color:var(--pc);text-align:center;overflow:hidden;line-height:1.15;word-break:break-word}
.lad.up .cell.cur{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25);filter:brightness(1.8)}100%{transform:scale(1)}}
.lad.down{animation:shake .5s}
.lad.down .cells{filter:drop-shadow(0 0 10px var(--r))}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.lad.fire .rk::after{content:'🔥';margin-left:2px;font-size:12px}
.lad.win .cell.on{background:linear-gradient(180deg,#fff3b0,var(--gold) 40%,#a87700);border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.lad.win .rk{color:var(--gold)}
.lad.win .nm{color:var(--gold)}
.lad .rk.r1{color:var(--gold)}.lad .rk.r2{color:#d9e2ec}.lad .rk.r3{color:#e09c5b}
.side{width:300px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;background:rgba(0,8,5,.7);min-height:0}
.side h3{font-family:'Russo One',sans-serif;font-size:13px;letter-spacing:.15em;color:var(--g);padding:12px 14px 6px}
#lb{list-style:none;padding:0 10px;overflow:auto;flex:1.3;min-height:0}
#lb li{display:flex;align-items:center;gap:8px;padding:6px 6px;border-bottom:1px solid rgba(46,230,200,.07);font-size:13px;transition:.3s}
#lb li .lp{width:24px;text-align:right;color:var(--mut);font-family:'Russo One',sans-serif}
#lb li .dot{width:9px;height:9px;border-radius:50%;background:var(--pc);box-shadow:0 0 6px var(--pc);flex:none}
#lb li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb li .l{font-family:'Russo One',sans-serif;color:var(--c)}
#lb li.done .l{color:var(--gold)}
#feed{overflow:hidden;flex:1;min-height:0;padding:0 14px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px}
#feed div{animation:feedIn .35s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feed .up{color:var(--g)}#feed .down{color:var(--r)}#feed .to{color:var(--mut)}#feed .win{color:var(--gold);font-weight:800}#feed .join{color:var(--c)}
@keyframes feedIn{from{transform:translateX(30px);opacity:0}}
#banner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:30;text-align:center;transition:.35s cubic-bezier(.2,1.6,.4,1)}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .bx{background:rgba(10,8,0,.92);border:2px solid var(--gold);border-radius:14px;padding:22px 40px;box-shadow:0 0 60px rgba(255,204,51,.45)}
#banner .t1{font-size:14px;color:var(--gold);letter-spacing:.3em}
#banner .t2{font-family:'Russo One',sans-serif;font-size:clamp(28px,5vw,58px);color:#fff;text-shadow:0 0 18px var(--gold);margin:6px 0}
#banner .t3{font-family:'Russo One',sans-serif;color:var(--gold);font-size:22px}
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,6,3,.9);text-align:center;padding:20px}
.overlay .big{font-family:'Russo One',sans-serif;font-size:clamp(90px,26vw,240px);color:var(--g);text-shadow:0 0 40px var(--g);animation:cd 1s infinite}
@keyframes cd{0%{transform:scale(1.4);opacity:0}30%{transform:scale(1);opacity:1}100%{opacity:.9}}
.overlay .term{font-size:14px;color:var(--g);text-align:left;margin-top:20px;min-height:90px;white-space:pre-line}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#061a24;border:1px solid var(--g);border-radius:12px;padding:22px;max-width:420px;width:100%;text-align:center}
.modal .box p{margin:6px 0 18px;line-height:1.5}

/* ===== results */
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res th{text-align:left;color:var(--mut);font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--line)}
table.res td{padding:9px 6px;border-bottom:1px solid rgba(46,230,200,.08)}
table.res tr.top1 td{color:var(--gold);font-weight:800}
table.res tr.top2 td{color:#e6eef5;font-weight:700}
table.res tr.top3 td{color:#e09c5b;font-weight:700}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:18px 0 6px}
.pod{text-align:center;width:150px}
.pod .bar{border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:'Russo One',sans-serif;font-size:34px}
.pod .who{font-weight:800;margin-bottom:6px;word-break:break-word}
.pod .tm{font-size:12px;color:var(--mut);margin-bottom:6px}
.hq{padding:10px 0;border-bottom:1px solid rgba(46,230,200,.08);font-size:14px;line-height:1.45}
.hq .pc{font-family:'Russo One',sans-serif;color:var(--r);margin-right:8px}
.hq .ans{color:var(--g);font-size:13px}

/* ===== player */
.pl{min-height:100%;display:flex;flex-direction:column;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.ptop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
.ptop .pn{color:var(--g);font-weight:800;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptop .lv{font-family:'Russo One',sans-serif;color:var(--c);font-size:16px}
.pbar{display:flex;gap:3px;margin:10px 0 12px;height:12px}
.pbar i{flex:1;border-radius:2px;background:rgba(46,230,200,.08);border:1px solid rgba(46,230,200,.15);transition:.3s}
.pbar i.on{background:var(--g);box-shadow:0 0 8px var(--g);border-color:var(--g)}
.pbar i.top{border-color:var(--gold)}
.timer{position:relative;height:30px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#020b10}
.timer .tf{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--g2),var(--g));width:100%}
.timer.low .tf{background:linear-gradient(90deg,#a3001f,var(--r))}
.timer .tn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Russo One',sans-serif;font-size:17px;color:#fff;text-shadow:0 0 4px #000,0 0 8px #000}
.qtopic{font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-top:14px}
.qtext{font-size:clamp(17px,4.8vw,22px);line-height:1.38;font-weight:700;margin:8px 0 16px;color:#f2fbfc}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-family:inherit;font-size:clamp(14px,4vw,17px);font-weight:700;line-height:1.3;color:#fff;border:none;border-radius:10px;padding:14px 14px;min-height:62px;cursor:pointer;transition:transform .1s,opacity .25s,filter .25s;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.opt .sh{font-size:22px;width:28px;text-align:center;flex:none}
.opt.o0{background:#d4123b}.opt.o1{background:#1e5fd8}.opt.o2{background:#c99700}.opt.o3{background:#178a3d}.opt.o4{background:#8a2bd8}.opt.o5{background:#d86a12}
.opts.locked .opt{pointer-events:none}
.opts.locked .opt:not(.sel):not(.right){opacity:.28;filter:grayscale(.6)}
.opt.sel{outline:3px solid #fff;outline-offset:2px}
.opt.right{outline:3px solid var(--g);outline-offset:2px;box-shadow:0 0 22px var(--g)}
.opt.wrong{filter:brightness(.6)}
.fb{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;text-align:center;transform:translateY(-110%);transition:transform .25s ease}
.fb.show{transform:none}
.fb.okk{background:linear-gradient(180deg,rgba(0,60,35,.98),rgba(0,40,22,.94));border-bottom:2px solid var(--g)}
.fb.bad{background:linear-gradient(180deg,rgba(80,0,18,.98),rgba(50,0,12,.94));border-bottom:2px solid var(--r)}
.fb.tmo{background:rgba(20,20,20,.97);border-bottom:2px solid var(--mut)}
.fb .t{font-family:'Russo One',sans-serif;font-size:26px;letter-spacing:.06em}
.fb.okk .t{color:var(--g)}.fb.bad .t{color:var(--r)}.fb.tmo .t{color:#ddd}
.fb .s{font-size:14px;margin-top:6px;color:#ddd}
.toast{position:fixed;left:12px;right:12px;top:12px;z-index:60;background:rgba(40,30,0,.97);border:1.5px solid var(--y);color:var(--y);border-radius:10px;padding:14px 16px;font-size:15px;font-weight:700;line-height:1.4;text-align:center;transform:translateY(-140%);transition:.3s}
.toast.show{transform:none}
.toast.pen{background:rgba(60,0,10,.97);border-color:var(--r);color:#ffd0d8}
.waitbox{margin:auto 0;text-align:center}
.spin{width:64px;height:64px;border:3px solid rgba(46,230,200,.15);border-top-color:var(--g);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.donebig{font-family:'Russo One',sans-serif;font-size:clamp(34px,10vw,60px);color:var(--gold);text-shadow:0 0 24px var(--gold);line-height:1.1}
.place{font-family:'Russo One',sans-serif;font-size:clamp(70px,22vw,140px);color:#fff;text-shadow:0 0 30px var(--g)}
.netdot{position:fixed;right:10px;bottom:10px;z-index:70;font-size:11px;padding:4px 8px;border-radius:20px;background:rgba(0,0,0,.7);border:1px solid var(--line);color:var(--mut)}
.netdot.off{color:var(--r);border-color:var(--r)}

@media (max-width:820px){
  .side{display:none}
  .lvlcol{width:60px}
  .lvlcol .cell{font-size:8.5px}
}
@media (max-width:560px){
  .arena{flex-direction:column}
  .lvlcol{display:none}
  .ladders{flex-direction:column;gap:4px}
  .lad{flex-direction:row;max-width:none;min-width:0;flex:none;height:30px}
  .lad .rk{width:30px;height:auto}
  .lad .nm{order:-1;width:80px;height:auto;padding:0 6px 0 0;align-items:center;justify-content:flex-start;text-align:left}
  .lad .cells{flex-direction:row-reverse}
  .doc{bottom:0;height:100%;width:calc(100% / var(--n));left:calc((var(--s) - 1) * 100% / var(--n))}
  .hbar{gap:12px}
  .stat b{font-size:17px}
}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="scan"></div>
<div id="app"></div>
<div id="banner"></div>
<div class="toast" id="toast"></div>
<div class="netdot" id="netdot" style="display:none"></div>

<script>

const QR_CDN = ['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'];

const LVL = ['ПРИЁМ','ЖАЛОБЫ','АНАМНЕЗ','ОСМОТР','ПАЛЬПАЦИЯ','АУСКУЛЬТАЦИЯ','ОАК','ОАМ','БИОХИМИЯ','ГОРМОНЫ','ЭКГ','УЗИ','РЕНТГЕН','КТ','МРТ','БИОПСИЯ','КОНСИЛИУМ','ДИФ. ДИАГНОЗ','ЛЕЧЕНИЕ'];

const rnd = (n = 8, ch = 'abcdefghijkmnpqrstuvwxyz23456789') => { let s = ''; for (let i = 0; i < n; i++) s += ch[Math.random() * ch.length | 0]; return s; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = ms => { ms = Math.max(0, ms | 0); const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

function loadScript(urls) {
  return new Promise((res, rej) => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) return rej(new Error('script load failed'));
      const s = document.createElement('script'); s.src = urls[i++]; s.async = true;
      s.onload = () => res(); s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}
function toast(html, cls = '', ms = 5000) {

  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

/* ================= SOUND ================= */
const SND = {
  ctx: null, on: true, last: 0,
  init() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  beep(f, d = .1, type = 'square', v = .05, when = 0) {
    if (!this.on || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
    } catch (e) {}
  },
  throttle() { const n = Date.now(); if (n - this.last < 140) return false; this.last = n; return true; },
  up() { if (this.throttle()) { this.beep(700, .07); this.beep(1050, .1, 'square', .05, .07); } },
  down() { if (this.throttle()) { this.beep(220, .22, 'sawtooth', .05); this.beep(150, .25, 'sawtooth', .05, .1); } },
  win() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.beep(f, .16, 'square', .06, i * .1)); },
  tick() { this.beep(1200, .03, 'square', .025); }
};

/* ================= ECG BG ================= */
(function ecg() {
  const cv = $('#matrix'), cx = cv.getContext('2d');
  let w, h, x = 0, prevY = null;
  const rs = () => { w = cv.width = innerWidth; h = cv.height = innerHeight; x = 0; prevY = null; };
  rs(); addEventListener('resize', rs);
  // one heartbeat (P, QRS, T) as offset in px, phase p in 0..1
  const beat = p => p < .10 ? -8 * Math.sin(p / .10 * Math.PI) : p < .17 ? 0 : p < .19 ? 10 : p < .22 ? -75 : p < .25 ? 25 : p < .32 ? 0 : p < .46 ? -15 * Math.sin((p - .32) / .14 * Math.PI) : 0;
  const PERIOD = 280;
  let last = 0;
  const loop = t => {
    requestAnimationFrame(loop);
    if (document.hidden || t - last < 16) return; last = t;
    const mid = h * .5, k = Math.max(1, h / 650);
    cx.strokeStyle = '#2ee6c8'; cx.lineWidth = 2; cx.shadowColor = '#2ee6c8'; cx.shadowBlur = 8;
    for (let i = 0; i < 4; i++) {
      const y = mid + beat((x % PERIOD) / PERIOD) * k;
      cx.clearRect(x, 0, 28, h); // gap ahead of the trace, like a monitor
      if (prevY != null) { cx.beginPath(); cx.moveTo(x - 1, prevY); cx.lineTo(x, y); cx.stroke(); }
      prevY = y;
      if (++x > w) { x = 0; prevY = null; }
    }
  };
  requestAnimationFrame(loop);
})();

/* ================= NETWORK ================= */
class Net {
  constructor() { this.subs = new Set(); this.client = null; this.bc = null; this.onmsg = () => {}; this.onstatus = () => {}; }
  async connect(bIdx) {
    if (LOCAL) {
      this.bc = new BroadcastChannel('vzlom-local');
      this.bc.onmessage = e => { const { topic, data } = e.data || {}; if (this.subs.has(topic)) this.onmsg(topic, data); };
      setTimeout(() => this.onstatus(true), 0);
      return true;
    }
    if (!window.mqtt) await loadScript(MQTT_CDN);
    return new Promise((res, rej) => {
      let done = false;
      const c = window.mqtt.connect(BROKERS[bIdx], {
        clientId: 'vz_' + rnd(12), clean: true, keepalive: 20, reconnectPeriod: 1500,
        connectTimeout: 8000, protocolVersion: 4, resubscribe: true
      });
      const t = setTimeout(() => { if (!done) { done = true; try { c.end(true); } catch (e) {} rej(new Error('timeout')); } }, 9000);
      c.on('connect', () => {
        for (const s of this.subs) c.subscribe(s, { qos: 1 });
        this.onstatus(true);
        if (!done) { done = true; clearTimeout(t); this.client = c; res(true); }
      });
      c.on('close', () => this.onstatus(false));
      c.on('offline', () => this.onstatus(false));
      c.on('error', () => {});
      c.on('message', (topic, payload) => {
        let d; try { d = JSON.parse(payload.toString()); } catch (e) { return; }
        this.onmsg(topic, d);
      });
    });
  }
  sub(topic) { this.subs.add(topic); if (this.client) this.client.subscribe(topic, { qos: 1 }); }
  pub(topic, data) {
    if (LOCAL) { if (this.bc) this.bc.postMessage({ topic, data }); return; }
    if (this.client) this.client.publish(topic, JSON.stringify(data), { qos: 1 });
  }
  end() { try { this.client && this.client.end(true); } catch (e) {} try { this.bc && this.bc.close(); } catch (e) {} }
}
const topicOf = (code, sub) => TOPIC_PREFIX + code + '/' + sub;
const brokerOf = code => Number(String(code)[0]) % BROKERS.length;
function makeCode(b) {
  const firsts = [1,2,3,4,5,6,7,8,9].filter(d => d % BROKERS.length === b);
  return String(firsts[Math.random() * firsts.length | 0]) + rnd(5, '0123456789');
}

/* ================= QUESTION BANKS ================= */
function parseBank(text) {
  const qs = [], errors = []; let topic = 'Общие вопросы', cur = null;
  const flush = () => {
    if (!cur) return;
    const nOk = cur.opts.filter(o => o.ok).length;
    if (cur.opts.length < 2 || nOk !== 1) errors.push(`Строка ${cur.line}: «${cur.q.slice(0, 50)}…» — нужно минимум 2 варианта и ровно один правильный (+)`);
    else qs.push({ topic: cur.topic, q: cur.q, opts: cur.opts.map(o => o.t), c: cur.opts.findIndex(o => o.ok) });
    cur = null;
  };
  String(text || '').split(/\r?\n/).forEach((raw, i) => {
    const l = raw.trim(); if (!l) return;
    const ch = l[0];
    if (ch === '#') { flush(); topic = l.replace(/^#+\s*/, '').replace(/^тема\s*:\s*/i, '').trim() || 'Общие вопросы'; return; }
    if (ch === '?') { flush(); cur = { q: l.slice(1).trim(), opts: [], topic, line: i + 1 }; return; }
    if (ch === '+' || ch === '-' || ch === '–' || ch === '—') {
      if (!cur) { errors.push(`Строка ${i + 1}: вариант ответа без вопроса`); return; }
      if (cur.opts.length >= 6) { errors.push(`Строка ${i + 1}: больше 6 вариантов — лишние пропущены`); return; }
      cur.opts.push({ t: l.slice(1).trim(), ok: ch === '+' }); return;
    }
    if (cur && cur.opts.length === 0) { cur.q += ' ' + l; return; }
    errors.push(`Строка ${i + 1}: непонятная строка «${l.slice(0, 40)}»`);
  });
  flush();
  const topics = [];
  qs.forEach(q => { let t = topics.find(x => x.name === q.topic); if (!t) topics.push(t = { name: q.topic, n: 0 }); t.n++; });
  return { qs, topics, errors };
}

function typeText(el, lines) {
  let li = 0, ci = 0;
  const step = () => {
    if (!el.isConnected) return;
    const l = lines[li % lines.length];
    el.textContent = l.slice(0, ci);
    if (ci++ > l.length + 18) { ci = 0; li++; }
    setTimeout(step, 55);
  };
  step();
}

      </div>
      <p class="muted" style="margin-top:12px;line-height:1.5">Правильный ответ: +1 ступень. Ошибка: −1 ступень. Не успел: новый вопрос, ступень та же. Выходы из игры видит только студент (предупреждение на телефоне); на вашем экране это выглядит как обычное падение. 0 = без штрафа.</p>
    </div>
    <div style="margin-top:22px"><button class="btn big full" id="bCreate">✚ Создать комнату</button></div>
    <p class="err" id="cErr" style="margin-top:10px"></p>
  </div>`;
  const drawTopics = () => {
    const bank = getBanks().find(b => b.id === $('#selBank').value) || BUILTIN;
    const p = parseBank(bank.text);
    const sel = (st.bank === bank.id && Array.isArray(st.topics)) ? st.topics : p.topics.map(t => t.name);
    $('#topics').innerHTML = p.topics.length ? `<div class="muted" style="margin-bottom:4px">Всего вопросов: <b class="ok">${p.qs.length}</b>. Отметьте темы для игры:</div>` +
      p.topics.map((t, i) => `<label class="chk"><input type="checkbox" data-topic="${esc(t.name)}" ${sel.includes(t.name) ? 'checked' : ''}> ${esc(t.name)} <span class="muted">(${t.n})</span></label>`).join('')
      : `<div class="err">В этом банке нет вопросов. Откройте редактор.</div>`;

  };
}

function download(name, text, type) {

/* ---------- room / connection ---------- */
async function hostConnect(preferB) {
  const order = preferB != null ? [preferB] : BROKERS.map((_, i) => i);
  let lastErr;
  for (const b of order) {
    const net = new Net();
    try { await net.connect(b); return { net, b }; } catch (e) { lastErr = e; net.end(); }
  }
  throw lastErr || new Error('no broker');
}
function hostWire(net, code) {
  H.net = net;
  net.onmsg = (topic, m) => { try { hostOnMsg(m); } catch (e) { console.error(e); } };
  net.onstatus = on => setNet(on, on ? '● сервер игры: онлайн' : '● переподключение…');
  net.sub(topicOf(code, 'h'));
}
async function createRoom(settings, bankName, pool) {
  const { net, b } = await hostConnect(null);
  const code = makeCode(b);
  H.g = { code, b, settings, bankName, pool, phase: 'lobby', players: {}, order: [], startAt: 0, endAt: 0, finished: 0, qstats: {}, events: [], created: Date.now() };
  hostWire(net, code);
  saveHost(true);
  renderLobby();
}
async function resumeHost(saved) {
  app().innerHTML = `<div class="center"><div class="spin"></div><div class="muted">Восстановление комнаты ${esc(saved.code)}…</div></div>`;
  try {
    const { net } = await hostConnect(saved.b);
    H.g = saved;
    Object.values(H.g.players).forEach(p => { p.cur = null; });
    hostWire(net, saved.code);
    if (H.g.phase === 'play') { renderGame(); Object.values(H.g.players).forEach(p => { if (!p.place) nextQ(p); }); }
    else renderLobby();
  } catch (e) { toast('Не удалось подключиться. Проверьте интернет.', 'pen'); renderHome(); }
}
function saveHost(now) {
  clearTimeout(H._sv);
  const doSave = () => LS.set('vzlom_host', H.g);
  if (now) doSave(); else H._sv = setTimeout(doSave, 500);
}
function hostSend(pid, msg) {
  const p = H.g.players[pid];
  if (p && p.bot) { botAct(p, msg); return; }
  H.net.pub(topicOf(H.g.code, 'p/' + pid), msg);
}
function hostBroadcast(msg) {
  H.net.pub(topicOf(H.g.code, 'all'), msg);
  Object.values(H.g.players).forEach(p => { if (p.bot) botAct(p, msg); });
}
// where students open the game; the teacher page itself is opened from a file on the teacher's computer
const STUDENT_URL = 'https://medstep-qbank.github.io/diagnoz/';
const studentBase = () => location.protocol === 'file:' && !LOCAL ? STUDENT_URL : location.origin + location.pathname.replace(/[^/]*$/, '');
function joinUrl() {
  // students always go to the student page, never to the teacher file
  let u = studentBase() + 'index.html?room=' + H.g.code;
  if (LOCAL) u += '&local=1';
  return u;
}

/* ---------- players logic ---------- */
function addPlayer(pid, name, bot) {
  const g = H.g;
  const p = { pid, name, bot: !!bot, ci: g.order.length, step: 0, maxStep: 0, stepAt: Date.now(), correct: 0, wrong: 0, timeouts: 0, streak: 0,
    leaves: 0, leaveIds: [], place: 0, finishedAt: 0, asked: [], lastQi: -1, cur: null, joinedAt: Date.now(), skill: .5 + Math.random() * .35 };
  g.players[pid] = p; g.order.push(pid);
  addEvent('join', `+ ${p.name} подключился`);
  return p;
}
function stateFor(p) {
  const g = H.g;
  const s = { t: 'state', phase: g.phase, name: p.name, step: p.step, steps: g.settings.steps, leaveN: g.settings.leaveN, leaves: p.leaves, secs: g.settings.secs };
  if (g.phase === 'play' && !p.place && p.cur && !p.cur.answered) {
    const q = g.pool[p.cur.qi];
    s.q = { qk: p.cur.qk, text: q.q, topic: q.topic, opts: p.cur.order.map(i => q.opts[i]), rem: Math.max(0, p.cur.deadline - Date.now()) };
  }
  if (p.place) s.done = { place: p.place, time: p.finishedAt };
  if (g.phase === 'end') s.result = resultFor(p);
  return s;
}
function pickQ(p) {
  const n = H.g.pool.length;
  let avail = [];
  for (let i = 0; i < n; i++) if (!p.asked.includes(i)) avail.push(i);
  if (!avail.length) { p.asked = []; avail = [...Array(n).keys()].filter(i => i !== p.lastQi); }
  const qi = avail[Math.random() * avail.length | 0];
  p.asked.push(qi); p.lastQi = qi;
  return qi;
}
function clearPT(p) { clearTimeout(H.timers[p.pid]); delete H.timers[p.pid]; }
function nextQ(p) {
  const g = H.g;
  if (g.phase !== 'play' || p.place || !g.players[p.pid]) return;
  const qi = pickQ(p), q = g.pool[qi];
  const order = shuffle([...q.opts.keys()]);
  p.cur = { qk: rnd(6), qi, order, cpos: order.indexOf(q.c), deadline: Date.now() + g.settings.secs * 1000, answered: false };
  clearPT(p);
  const qk = p.cur.qk;
  H.timers[p.pid] = setTimeout(() => onTimeout(p, qk), g.settings.secs * 1000 + 2500);
  hostSend(p.pid, stateFor(p));
  saveHost();
}
function qstat(qi) { return H.g.qstats[qi] || (H.g.qstats[qi] = { n: 0, w: 0, t: 0 }); }
function scheduleNext(p, ms) { clearPT(p); H.timers[p.pid] = setTimeout(() => nextQ(p), ms); }
function onAnswer(p, qk, a) {
  const g = H.g;
  if (g.phase !== 'play' || p.place || !p.cur || p.cur.qk !== qk || p.cur.answered) return;
  p.cur.answered = true; clearPT(p);
  const ok = Number(a) === p.cur.cpos;
  const st = qstat(p.cur.qi); st.n++;
  const prev = p.step;
  if (ok) { p.correct++; p.streak++; p.step = Math.min(g.settings.steps, p.step + 1); }
  else { st.w++; p.wrong++; p.streak = 0; p.step = Math.max(0, p.step - 1); }
  if (p.step !== prev) p.stepAt = Date.now();
  p.maxStep = Math.max(p.maxStep, p.step);
  hostSend(p.pid, { t: 'res', qk, ok, cpos: p.cur.cpos, step: p.step, steps: g.settings.steps });
  if (ok) addEvent('up', `▲ ${p.name} → ур. ${p.step}`); else addEvent('down', `▼ ${p.name} → ур. ${p.step}`);
  hostAnim(p, ok ? 'up' : 'down', prev);
  if (p.step >= g.settings.steps) finishPlayer(p);
  else scheduleNext(p, 1800);
  saveHost();
}
function onTimeout(p, qk) {
  const g = H.g;
  if (g.phase !== 'play' || p.place || !p.cur || p.cur.qk !== qk || p.cur.answered) return;
  p.cur.answered = true; clearPT(p);
  qstat(p.cur.qi).t++; p.timeouts++; p.streak = 0;
  hostSend(p.pid, { t: 'res', qk, timeout: true, cpos: p.cur.cpos, step: p.step, steps: g.settings.steps });
  addEvent('to', `⌛ ${p.name}: время вышло`);
  hostAnim(p, 'to');
  scheduleNext(p, 1600);
  saveHost();
}
function onLeave(p, lid) {
  const g = H.g;
  if (!lid || p.leaveIds.includes(lid)) return;
  p.leaveIds.push(lid); if (p.leaveIds.length > 60) p.leaveIds.shift();
  if (g.phase !== 'play' || p.place) return;
  p.leaves++;
  let pen = false;
  if (g.settings.leaveN > 0 && p.leaves % g.settings.leaveN === 0 && p.step > 0) {
    const prev = p.step; p.step--; p.stepAt = Date.now(); p.streak = 0; pen = true;
    addEvent('down', `▼ ${p.name} → ур. ${p.step}`);
    hostAnim(p, 'down', prev);
  }
  hostSend(p.pid, { t: 'warn', leaves: p.leaves, leaveN: g.settings.leaveN, pen, step: p.step, steps: g.settings.steps });
  saveHost();
}
function finishPlayer(p) {
  const g = H.g;
  g.finished++; p.place = g.finished; p.finishedAt = Date.now() - g.startAt;
  p.cur = null; clearPT(p);
  addEvent('win', `✚ ${p.name}: ДИАГНОЗ ПОСТАВЛЕН — #${p.place} (${fmt(p.finishedAt)})`);
  hostSend(p.pid, stateFor(p));
  showBanner(p);
  SND.win();
  const all = Object.values(g.players);
  if (all.length && all.every(x => x.place)) setTimeout(() => { if (H.g.phase === 'play') endGame(); }, 4000);
}
function ranking() {
  return Object.values(H.g.players).sort((a, b) => {
    if (a.place && b.place) return a.place - b.place;
    if (a.place) return -1; if (b.place) return 1;
    if (b.step !== a.step) return b.step - a.step;
    return a.stepAt - b.stepAt;
  });
}
function resultFor(p) {
  const r = ranking(); const idx = r.indexOf(p);
  return { rank: idx + 1, of: r.length, finished: !!p.place, time: p.finishedAt, step: p.step, steps: H.g.settings.steps, correct: p.correct, wrong: p.wrong, timeouts: p.timeouts };
}
function hostOnMsg(m) {
  const g = H.g;
  if (!g || !m || !m.pid || typeof m.pid !== 'string') return;
  let p = g.players[m.pid];
  switch (m.t) {
    case 'join': {
      const name = String(m.name || '').trim().slice(0, 18) || 'Игрок';
      if (!p) {
        if (g.phase === 'end') { hostSend(m.pid, { t: 'state', phase: 'end' }); return; }
        if (g.order.length >= 60) return;
        p = addPlayer(m.pid, name, false);
        if (g.phase === 'play') { hostAddLadder(p); nextQ(p); }
      }
      if (m.lid) onLeave(p, m.lid);
      if (g.phase === 'play' && !p.place && p.cur && !p.cur.answered && Date.now() > p.cur.deadline + 500) { onTimeout(p, p.cur.qk); }
      else if (g.phase === 'play' && !p.place && !p.cur) nextQ(p);
      else hostSend(p.pid, stateFor(p));
      if (H.screen === 'lobby') drawLobbyChips();
      saveHost();
      break;
    }
    case 'sync': if (p) hostSend(p.pid, stateFor(p)); else hostSend(m.pid, { t: 'unknown' }); break;
    case 'ans': if (p) onAnswer(p, m.qk, m.a); break;
    case 'to': if (p) onTimeout(p, m.qk); break;
    case 'leave': if (p) onLeave(p, m.lid); break;
  }
}

/* ---------- bots (для проверки) ---------- */
function addBots(n) {
  const used = new Set(Object.values(H.g.players).map(p => p.name.replace(' 🤖', '')));
  for (let i = 0; i < n; i++) {
    let name = BOT_NAMES.find(x => !used.has(x)) || ('Бот ' + (H.g.order.length + 1));
    used.add(name);
    const p = addPlayer('bot_' + rnd(6), name + ' 🤖', true);
    if (H.g.phase === 'play') { hostAddLadder(p); nextQ(p); }
  }
  if (H.screen === 'lobby') drawLobbyChips();
}
function botAct(p, msg) {
  if (msg.t !== 'state' || !msg.q || H.g.phase !== 'play') return;
  const qk = msg.q.qk, secs = H.g.settings.secs;
  clearTimeout(H.botT[p.pid]);
  if (Math.random() < .07) return;
  const delay = 1200 + Math.random() * Math.max(1000, secs * 1000 - 2200);
  H.botT[p.pid] = setTimeout(() => {
    if (!H.g.players[p.pid] || !p.cur || p.cur.qk !== qk) return;
    if (Math.random() < .03) onLeave(p, rnd(6));
    const n = msg.q.opts.length, c = p.cur.cpos;
    const a = Math.random() < p.skill ? c : (c + 1 + (Math.random() * (n - 1) | 0)) % n;
    onAnswer(p, qk, a);
  }, delay);
}

function showCountdown(ms, isHost, done) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="big" id="cdN">3</div><div class="term" id="cdT"></div>`;
  document.body.appendChild(o);
  const lines = ['> моем руки…', '> надеваем перчатки…', '> пациент в кабинете…'];
  const end = Date.now() + ms;
  let shown = -1;
  const iv = setInterval(() => {
    const left = end - Date.now();
    const n = Math.ceil(left / 1000) - 0;
    const lbl = left <= 600 ? 'GO!' : String(Math.max(1, Math.min(3, Math.ceil((left - 600) / 1000))));
    const nEl = o.querySelector('#cdN');
    if (nEl && nEl.textContent !== lbl) { nEl.textContent = lbl; nEl.style.animation = 'none'; void nEl.offsetWidth; nEl.style.animation = ''; if (isHost) SND.beep(lbl === 'GO!' ? 1200 : 600, .12); }
    const li = Math.min(lines.length - 1, Math.floor((ms - left) / (ms / lines.length)));
    if (li !== shown) { shown = li; o.querySelector('#cdT').textContent = lines.slice(0, li + 1).join('\n'); }
    if (left <= 0) { clearInterval(iv); o.remove(); done && done(); }
  }, 80);
}

function hostAddLadder(p) {

const P = { net: null, code: '', pid: '', name: '', step: 0, steps: 10, phase: '', q: null, answered: false, chosen: -1, deadline: 0, raf: 0, toSent: false, pendingLeave: null, resT: null, screen: '' };

function renderJoin(code, err) {

async function playerConnect(code, pid, name) {
  P.code = code; P.pid = pid; P.name = name;
  if (P.net) P.net.end();
  const net = new Net(); P.net = net;
  net.onmsg = (topic, m) => { try { plOnMsg(m); } catch (e) { console.error(e); } };
  let wasOff = false;
  net.onstatus = on => { setNet(on); if (on && wasOff) sendJoin(); wasOff = !on; };
  net.sub(topicOf(code, 'p/' + pid)); net.sub(topicOf(code, 'all'));
  await net.connect(brokerOf(code));
  renderWait('Подключение к комнате…');
  sendJoin();
  clearTimeout(P.joinT);
  P.joinT = setTimeout(() => { if (!P.phase) renderJoin(code, 'Комната не отвечает. Проверьте код или попросите преподавателя открыть комнату.'); }, 9000);
  requestWake();
}
function plSend(m) { m.pid = P.pid; if (P.net) P.net.pub(topicOf(P.code, 'h'), m); }
function sendJoin() {
  const m = { t: 'join', name: P.name };
  const pend = LS.get('vzlom_pl_leave', null);
  if (pend && pend.code === P.code) m.lid = pend.lid;
  plSend(m);
}
function plOnMsg(m) {
  if (!m || !m.t) return;
  switch (m.t) {
    case 'state': clearTimeout(P.joinT); clearTimeout(P.resT); applyState(m); break;
    case 'res': clearTimeout(P.resT); showRes(m); break;
    case 'warn': LS.del('vzlom_pl_leave'); P.step = m.step; P.steps = m.steps; drawPBar(); showWarn(m); break;
    case 'countdown': if (P.phase === 'lobby' || !P.phase) showCountdown(m.ms, false, () => { if (P.screen !== 'q') renderWait('Загрузка вопроса…'); }); break;
    case 'kicked': P.phase = ''; LS.del('vzlom_pl'); renderJoin(P.code, 'Преподаватель удалил вас из комнаты. Можно подключиться снова.'); break;
    case 'closed': P.phase = ''; LS.del('vzlom_pl'); renderJoin('', 'Комната закрыта.'); break;
    case 'unknown': sendJoin(); break;
  }
}
function applyState(m) {
  const firstPlay = P.phase !== 'play' && m.phase === 'play';
  P.phase = m.phase; P.step = m.step || 0; P.steps = m.steps || P.steps; P.name = m.name || P.name; if (m.secs) P.secs = m.secs;
  if (m.phase === 'lobby') { renderWait('Вы в игре! Ждём, когда преподаватель начнёт…'); return; }
  if (m.phase === 'end') { stopTimer(); renderEnd(m.result); return; }
  if (m.phase === 'play') {
    if (firstPlay) LS.del('vzlom_pl_leave');
    if (m.done) { stopTimer(); renderDone(m.done); return; }
    if (m.q) { if (!P.q || P.q.qk !== m.q.qk || P.screen !== 'q') renderQ(m.q); return; }
    if (P.screen !== 'q') renderWait('Загрузка вопроса…');
  }
}
function plHeader() {
  return `<div class="ptop"><span class="pn">${esc(P.name)}</span><span class="lv" id="pLv">УРОВЕНЬ ${P.step}/${P.steps}</span></div><div class="pbar" id="pBar"></div>`;
}

function renderQ(q) {

  </div><div class="fb" id="fb"></div>`;

function startTimer() {
  stopTimer();

  let lastSec = -1;
  const loop = () => {
    const left = P.deadline - performance.now();
    const tf = $('#tf'), tn = $('#tn'), tm = $('#tm');
    if (!tf) return;
    const frac = clamp(left / totalMs, 0, 1);
    tf.style.width = (frac * 100) + '%';
    const s = Math.max(0, Math.ceil(left / 1000));
    tn.textContent = s;
    tm.classList.toggle('low', left < 5000);

      return;

    P.raf = requestAnimationFrame(loop);
  };
  P.raf = requestAnimationFrame(loop);
}

let wakeLock = null;

(function boot() {

  if (room.length === 6) {
    const pl = LS.get('vzlom_pl', {});
    if (pl.code === room && pl.pid && pl.name) {
      app().innerHTML = `<div class="center"><div class="spin"></div><div class="muted">Возвращаемся в игру…</div></div>`;
      playerConnect(room, pl.pid, pl.name).catch(() => renderJoin(room, 'Нет связи с сервером игры. Попробуйте снова.'));
    } else renderJoin(room);
    return;
  }
  if (TEACHER) renderHome(); else renderJoin('');
})();
</script>
